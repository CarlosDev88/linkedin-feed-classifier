services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
      - ${HOST_SCRAPER_PATH:-./data/raw}:/data/raw:ro
      - embeddings_cache:/root/.cache
    env_file:
      - .env
    command: streamlit run labeling_app/app.py --server.address=0.0.0.0 --server.port=8501

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - embeddings_cache:/root/.cache
    env_file:
      - .env
    command: uvicorn serving.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  embeddings_cache:
